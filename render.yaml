# yaml-language-server: $schema=https://render.com/schema/render.yaml.json

services:
  - type: web
    name: followup-agent-api
    runtime: node
    plan: free
    region: singapore
    branch: main
    autoDeploy: true
    buildCommand: pnpm install --frozen-lockfile --prod=false && pnpm api:build
    startCommand: pnpm --filter @followup-agent/api start:deploy
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: followup-agent-postgres
          property: connectionString
      - key: CORS_ORIGIN
        fromService:
          type: web
          name: followup-agent-web
          envVarKey: RENDER_EXTERNAL_URL
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-5.6
      - key: AGENT_ALLOW_AUTO_WRITE
        value: "false"

  - type: web
    name: followup-agent-web
    runtime: static
    branch: main
    autoDeploy: true
    buildCommand: pnpm install --frozen-lockfile && pnpm web:build
    staticPublishPath: ./apps/web/dist
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: followup-agent-api
          envVarKey: RENDER_EXTERNAL_URL
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: DENY

databases:
  - name: followup-agent-postgres
    databaseName: followup_agent
    user: followup_agent
    plan: free
    region: singapore
    postgresMajorVersion: "18"
    ipAllowList: []
